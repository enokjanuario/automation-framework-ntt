# ============================================================
# CONFIGURACOES DO AMBIENTE DE DESENVOLVIMENTO
# ============================================================

# Ambiente
env=dev

# API URLs (mesmas da producao para APIs publicas)
api.restcountries.base.url=https://restcountries.com
api.jsonplaceholder.base.url=https://jsonplaceholder.typicode.com

# Web URL
web.base.url=https://www.netshoes.com.br

# Browser
web.browser=chrome
web.headless=false

# Timeouts mais longos para debug
web.timeout.implicit=15
web.timeout.explicit=20
web.timeout.page.load=60

# Logs mais detalhados
api.logging.enabled=true

# Parallelismo reduzido para debug
parallel.threads=2
