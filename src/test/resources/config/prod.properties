# ============================================================
# CONFIGURACOES DO AMBIENTE DE PRODUCAO
# ============================================================
# ATENCAO: Use com cautela em producao!
# ============================================================

# Ambiente
env=prod

# API URLs
api.restcountries.base.url=https://restcountries.com
api.jsonplaceholder.base.url=https://jsonplaceholder.typicode.com

# Web URL
web.base.url=https://www.netshoes.com.br

# Browser - headless para CI/CD
web.browser=chrome
web.headless=true

# Timeouts otimizados
web.timeout.implicit=10
web.timeout.explicit=15
web.timeout.page.load=30

# Logs reduzidos
api.logging.enabled=false

# Parallelismo maximo
parallel.threads=8
