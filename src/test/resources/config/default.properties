# ============================================================
# CONFIGURACOES PADRAO DO FRAMEWORK DE AUTOMACAO
# ============================================================
# Este arquivo contem configuracoes padrao que podem ser
# sobrescritas por arquivos especificos de ambiente (dev, staging, prod)
# ou via system properties (-Dapi.base.url=...)
# ============================================================

# ==================== API Configuration ====================

# RESTCountries API
api.restcountries.base.url=https://restcountries.com

# JSONPlaceholder API
api.jsonplaceholder.base.url=https://jsonplaceholder.typicode.com

# Timeouts (em milissegundos)
api.timeout.connection=10000
api.timeout.response=30000

# Retry
api.retry.count=3

# Logging
api.logging.enabled=true

# ==================== Web Configuration ====================

# URL base da aplicacao
web.base.url=https://www.netshoes.com.br

# Browser (chrome, firefox, edge)
web.browser=chrome

# Modo headless
web.headless=false

# Timeouts (em segundos)
web.timeout.implicit=10
web.timeout.explicit=15
web.timeout.page.load=30

# Window
web.window.maximize=true

# Screenshots
web.screenshots.on.failure=true

# ==================== Environment ====================

# Ambiente padrao
env=dev

# Execucao paralela
parallel.enabled=true
parallel.threads=4
